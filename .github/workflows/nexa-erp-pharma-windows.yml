name: NEXA ERP (Pharma) Windows
on:
  workflow_dispatch:
  push:
    paths:
      - 'apps/nexa-erp-pharma/**'
jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: apps/nexa-erp-pharma/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: NEXA-ERP-Pharma-Windows
          path: apps/nexa-erp-pharma/desktop/dist/*.exe
