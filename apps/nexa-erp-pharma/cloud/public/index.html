<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NEXA ERP (Pharma)</title><style>body{margin:0;font:15px Inter,Arial;background:#07111f;color:#eaf2ff}header{padding:24px 5%;border-bottom:1px solid #1d344c;display:flex;justify-content:space-between}main{padding:5%;max-width:1200px;margin:auto}.badge{border:1px solid #2b6b93;border-radius:20px;padding:8px 12px;color:#8fd4ff}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin:25px 0}.card,section{background:#0c1b2e;border:1px solid #19324b;border-radius:16px;padding:20px}.v{font-size:28px;font-weight:bold;margin-top:8px}table{width:100%;border-collapse:collapse}td,th{padding:12px;border-bottom:1px solid #19324b;text-align:left}@media(max-width:800px){.cards{grid-template-columns:1fr 1fr}}</style></head><body><header><strong>NEXA ERP (Pharma)</strong><span class="badge">CLOUD ERP</span></header><main><h1>Pharmacy Command Center</h1><p style="color:#8da7c1">AI-backed inventory, billing, purchasing and pharmacy operations.</p><div class="cards"><div class="card">Medicines<div class="v" id="m">—</div></div><div class="card">Low Stock<div class="v" id="l">—</div></div><div class="card">Expiry Risk<div class="v" id="e">—</div></div><div class="card">Sales<div class="v" id="s">₹0</div></div></div><section><h2>Inventory</h2><table><thead><tr><th>Medicine</th><th>Batch</th><th>Stock</th><th>Expiry</th></tr></thead><tbody id="t"></tbody></table></section></main><script>fetch('/api/data').then(r=>r.json()).then(d=>{document.querySelector('#m').textContent=d.medicines.length;document.querySelector('#l').textContent=d.medicines.filter(x=>x.stock<=x.reorderLevel).length;document.querySelector('#e').textContent=d.medicines.filter(x=>x.expiry&&new Date(x.expiry)<=new Date(Date.now()+90*864e5)).length;document.querySelector('#s').textContent='₹'+d.sales.reduce((a,x)=>a+Number(x.total||0),0).toLocaleString('en-IN');document.querySelector('#t').innerHTML=d.medicines.map(x=>`<tr><td>${x.name}</td><td>${x.batch}</td><td>${x.stock}</td><td>${x.expiry}</td></tr>`).join('')})</script></body></html>
