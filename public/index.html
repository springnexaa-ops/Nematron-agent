<html lang="en">
<head>

<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<style>
html,body{margin:0;min-height:100%;background:#071018;color:#edf6ff;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}body{display:grid;place-items:center}#nexa-loader{min-height:100vh;width:100%;display:grid;place-items:center;text-align:center;background:radial-gradient(circle at 50% 35%,#12304a 0,#071018 55%,#04090e 100%)}#nexa-loader .box{padding:28px}#nexa-loader img{width:52px;height:52px;border-radius:15px;background:#fff;margin-bottom:14px}#nexa-loader b{display:block;font-size:18px}#nexa-loader span{display:block;margin-top:7px;color:#8298a9;font-size:12px}#nexa-loader i{display:block;width:24px;height:24px;border:2px solid #315064;border-top-color:#edf6ff;border-radius:50%;animation:spin .8s linear infinite;margin:18px auto 0}@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div id="nexa-loader"><div class="box"><img src="/springnexa-logo.svg" alt="SpringNexa"><b>NEXA AI</b><span>Loading your secure AI workspace…</span><i></i></div></div>
